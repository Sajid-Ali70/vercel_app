<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard v2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Login Container -->
    <div id="loginSection" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow border-0">
                    <div class="card-body p-4 text-center">
                        <div class="mb-4">
                            <i class="fas fa-user-shield fa-3x text-primary-custom"></i>
                        </div>
                        <h3 class="fw-bold mb-0">Admin Login</h3>
                        <p class="text-muted small mb-4">Dashboard v2.0</p>
                        
                        <!-- Using div instead of form to 100% guarantee no browser submission -->
                        <div id="loginFields">
                            <div class="mb-3 text-start">
                                <label class="form-label">Email Address</label>
                                <input type="email" id="loginEmail" class="form-control" placeholder="admin@example.com">
                            </div>
                            <div class="mb-4 text-start">
                                <label class="form-label">Password</label>
                                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
                            </div>
                            <button type="button" id="btnLogin" class="btn btn-primary-custom w-100 py-2">Login</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div id="adminDashboard" class="d-none">
        <div class="container-fluid">
            <div class="row">
                <!-- Sidebar -->
                <nav class="col-md-2 d-md-block admin-sidebar collapse">
                    <div class="position-sticky pt-3">
                        <div class="px-3 mb-4">
                            <h5 class="fw-bold m-0">MOBILE STORE</h5>
                            <small class="text-white-50">Admin Panel v2.0</small>
                        </div>
                        <ul class="nav flex-column">
                            <li class="nav-item"><a class="nav-link active" href="#" onclick="showSection('overview', event)"><i class="fas fa-chart-pie me-2"></i> Overview</a></li>
                            <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('products', event)"><i class="fas fa-mobile-alt me-2"></i> Products</a></li>
                            <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('orders', event)"><i class="fas fa-shopping-cart me-2"></i> Orders</a></li>
                            <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('refunds', event)"><i class="fas fa-undo-alt me-2"></i> Refunds</a></li>
                            <li class="nav-item mt-4"><hr class="bg-white"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </nav>

                <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                    <section id="overviewSection" class="dashboard-section">
                        <h2 class="h4 mb-4 fw-bold">Dashboard Overview</h2>
                        <div class="row g-4 mb-4">
                            <div class="col-md-3"><div class="card stats-card border-0 shadow-sm h-100 p-3"><div class="text-muted small fw-bold">TOTAL ORDERS</div><div class="h2 fw-bold" id="statTotalOrders">0</div></div></div>
                            <div class="col-md-3"><div class="card stats-card border-0 shadow-sm h-100 p-3" style="border-left-color: #f1c40f !important;"><div class="text-muted small fw-bold">PENDING ORDERS</div><div class="h2 fw-bold text-warning" id="statPendingOrders">0</div></div></div>
                            <div class="col-md-3"><div class="card stats-card border-0 shadow-sm h-100 p-3" style="border-left-color: #2ecc71 !important;"><div class="text-muted small fw-bold">REVENUE</div><div class="h2 fw-bold text-success" id="statRevenue">Rs. 0</div></div></div>
                            <div class="col-md-3"><div class="card stats-card border-0 shadow-sm h-100 p-3" style="border-left-color: #e74c3c !important;"><div class="text-muted small fw-bold">PENDING REFUNDS</div><div class="h2 fw-bold text-danger" id="statPendingRefunds">0</div></div></div>
                        </div>
                    </section>

                    <section id="productsSection" class="dashboard-section d-none">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="h4 fw-bold">Product Management</h2>
                            <button class="btn btn-primary-custom px-4" onclick="openAddProductModal()"><i class="fas fa-plus me-2"></i>Add New Product</button>
                        </div>
                        <div class="table-responsive bg-white rounded shadow-sm">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light"><tr><th>Image</th><th>Name</th><th>Brand</th><th>Price</th><th>Stock</th><th class="text-end">Action</th></tr></thead>
                                <tbody id="productTableBody"></tbody>
                            </table>
                        </div>
                    </section>
                </main>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Product Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="productFields">
                        <input type="hidden" id="editProductId">
                        <div class="row g-3">
                            <div class="col-md-4"><label class="form-label">Product Name</label><input type="text" id="pName" class="form-control"></div>
                            <div class="col-md-4"><label class="form-label">Brand</label><input type="text" id="pBrand" class="form-control"></div>
                            <div class="col-md-4"><label class="form-label">Model</label><input type="text" id="pModel" class="form-control"></div>
                            <div class="col-md-4"><label class="form-label">Cash Price</label><input type="number" id="pCashPrice" class="form-control"></div>
                            <div class="col-md-4"><label class="form-label">Inst. Price</label><input type="number" id="pInstPrice" class="form-control"></div>
                            <div class="col-md-4"><label class="form-label">Stock</label><input type="number" id="pStock" class="form-control"></div>
                            <div class="col-12"><label class="form-label">Images</label><input type="file" id="pImages" class="form-control" multiple></div>
                        </div>
                        <button type="button" id="btnSaveProduct" class="btn btn-primary-custom w-100 mt-4 py-3 fw-bold">Save Product</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>

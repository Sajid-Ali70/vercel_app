<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refund Request - Mobile Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MOBILE STORE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalog.html">Phones</a></li>
                    <li class="nav-item"><a class="nav-link active" href="refund.html">Refund Request</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-secondary-custom ms-lg-3" href="admin.html">Admin Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-5">
                            <i class="fas fa-undo-alt fa-3x text-danger mb-3"></i>
                            <h2 class="fw-bold">Refund Your Payment</h2>
                            <p class="text-muted">Please fill in the details below to request a refund. Our team will process it shortly.</p>
                        </div>
                        
                        <form id="refundForm">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Order Reference Number</label>
                                    <input type="text" id="orderRef" class="form-control" placeholder="e.g. ORD-12345" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Phone Number</label>
                                    <input type="tel" id="refundPhone" class="form-control" placeholder="080XXXXXXXX" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">Reason for Refund</label>
                                    <select id="refundReason" class="form-select" required>
                                        <option value="">Select a reason</option>
                                        <option value="Damaged product">Damaged product</option>
                                        <option value="Wrong product">Wrong product</option>
                                        <option value="Changed mind">Changed mind</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">Description</label>
                                    <textarea id="refundDesc" class="form-control" rows="4" placeholder="Tell us more about the issue..." required></textarea>
                                </div>
                                
                                <h5 class="mt-5 fw-bold text-primary">Bank Details for Refund</h5>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Bank Name</label>
                                    <input type="text" id="bankName" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Account Number</label>
                                    <input type="text" id="accNumber" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Account Holder</label>
                                    <input type="text" id="accHolder" class="form-control" required>
                                </div>
                                
                                <div class="col-12">
                                    <label class="form-label fw-bold">Proof of Payment Upload</label>
                                    <input type="file" id="proofUpload" class="form-control" accept="image/*" required>
                                    <small class="text-muted">Upload a screenshot or photo of your payment receipt.</small>
                                </div>
                            </div>
                            
                            <div class="mt-5">
                                <button type="submit" class="btn btn-danger btn-lg w-100 py-3 fw-bold shadow-sm">
                                    Submit Refund Request
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2023 Mobile Store. All rights reserved.</p>
        </div>
    </footer>

    <!-- Firebase Scripts (Compatibility Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard v8.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Navy Blue background to confirm the update */
        #loginSection { 
            background-color: #001f3f !important; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        .login-card { width: 400px; padding: 30px; border-radius: 15px; background: white; }
        .version-label { position: fixed; top: 10px; left: 10px; color: yellow; font-weight: bold; z-index: 9999; }
    </style>
</head>
<body class="bg-light">
    <div class="version-label">DEBUG VERSION 8.0</div>

    <!-- Login UI (Pure Divs, no Forms) -->
    <div id="loginSection">
        <div class="login-card shadow-lg text-center">
            <i class="fas fa-lock fa-3x text-primary mb-3"></i>
            <h3 class="fw-bold">ADMIN ACCESS</h3>
            <p class="text-muted small">Please verify your identity</p>
            <div class="text-start mt-4">
                <div class="mb-3">
                    <label class="form-label">Admin Email</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="admin@example.com">
                </div>
                <div class="mb-4">
                    <label class="form-label">Secure Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
                </div>
                <button type="button" id="btnLogin" class="btn btn-primary w-100 py-2 fw-bold">AUTHENTICATE</button>
            </div>
        </div>
    </div>

    <!-- Dashboard UI -->
    <div id="adminDashboard" class="d-none">
        <div class="container-fluid">
            <div class="row">
                <nav class="col-md-2 bg-dark text-white min-vh-100 p-4">
                    <h5 class="fw-bold mb-4">MANAGEMENT</h5>
                    <button class="btn btn-link text-white text-decoration-none w-100 text-start mb-2" onclick="showSection('overview')"><i class="fas fa-home me-2"></i>Overview</button>
                    <button class="btn btn-link text-white text-decoration-none w-100 text-start mb-2" onclick="showSection('products')"><i class="fas fa-mobile-alt me-2"></i>Inventory</button>
                    <button class="btn btn-outline-danger w-100 mt-5" onclick="logout()">Logout</button>
                </nav>
                <main class="col-md-10 p-5">
                    <section id="overviewSection" class="dashboard-section">
                        <h2 class="fw-bold mb-4">Dashboard Overview</h2>
                        <div class="row g-4">
                            <div class="col-md-4">
                                <div class="card p-4 border-0 shadow-sm">
                                    <div class="text-muted small">TOTAL TRANSACTIONS</div>
                                    <div class="h1 fw-bold" id="statTotalOrders">0</div>
                                </div>
                            </div>
                        </div>
                    </section>
                    <section id="productsSection" class="dashboard-section d-none">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="fw-bold">Inventory Management</h2>
                            <button type="button" class="btn btn-success px-4" onclick="openAddProductModal()">+ NEW PRODUCT</button>
                        </div>
                        <div class="table-responsive bg-white rounded shadow-sm">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light"><tr><th>Product</th><th>Price</th><th>Stock</th><th class="text-end">Action</th></tr></thead>
                                <tbody id="productTableBody"></tbody>
                            </table>
                        </div>
                    </section>
                </main>
            </div>
        </div>
    </div>

    <!-- Product Entry Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="fw-bold">Inventory Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="editProductId">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Device Name</label><input type="text" id="pName" class="form-control"></div>
                        <div class="col-md-6"><label class="form-label">Brand</label><input type="text" id="pBrand" class="form-control"></div>
                        <div class="col-md-4"><label class="form-label">Cash Price (Rs.)</label><input type="number" id="pCashPrice" class="form-control"></div>
                        <div class="col-md-4"><label class="form-label">Monthly Inst. (Rs.)</label><input type="number" id="pInstPrice" class="form-control"></div>
                        <div class="col-md-4"><label class="form-label">Stock Count</label><input type="number" id="pStock" class="form-control"></div>
                        <div class="col-12"><label class="form-label">Images</label><input type="file" id="pImages" class="form-control"></div>
                    </div>
                    <button type="button" id="btnSaveProduct" class="btn btn-primary w-100 mt-4 py-3 fw-bold">COMMIT TO DATABASE</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Core Dependencies -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
